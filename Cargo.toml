[package]
name = "wgpu_learning"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30.9"
wgpu = "24.0.1"
env_logger = "0.11.7"
log = "0.4.26"
pollster = "0.4.0"
bytemuck = { version = "1.22.0", features = ["derive"] }
anyhow = "1.0.97"
cgmath = "0.18.0"
tobj = { version = "4.0.3", default-features = false, features = ["tokio"] }
PMXUtil = "0.9.0"

[dependencies.image]
version = "0.25.5"
default-features = false
features = ["png", "jpeg"]

[build-dependencies]
anyhow = "1.0.97"
fs_extra = "1.3.0"
glob = "0.3.2"